engine_speed: The rotational speed of the engine in revolutions per minute (RPM). Used as the primary input for calculating air mass flow and power output across the operating range.
boost_pressure: The target pressure increase above ambient air pressure produced by the turbocharger compressor.
volumetric_efficiency: The percentage of theoretical cylinder volume actually filled with air during the intake stroke. Typically less than 100% at low RPMs due to restriction and heat, but can exceed 100% at higher RPMs due to air inertia and exhaust scavenging effects.
intake_restriction: The pressure drop caused by the intake air filter and intake tract before the turbocharger compressor inlet. Typically less than 1 psi for a clean filter.
intercooler_efficiency: How effectively the intercooler can cool the charge air back to ambient temperature. Expressed as a percentage (0-100%), where 100% represents perfect cooling to ambient conditions. Typical values range from 75-95% depending on intercooler design and airflow.
intercooler_pressure_drop: The boost pressure loss across the intercooler due to air flowing through the core. Typical values range from 2-5 psi depending on intercooler core design, fin density, and air velocity. Higher values indicate greater restriction and cooling efficiency trade-off.
compressor_efficiency: The isentropic efficiency of the turbocharger compressor, obtained from the demand line on the compressor map. Expressed as a percentage (0-100%), where higher values indicate less energy loss during compression. Typical values range from 70-85% depending on compressor design and operating point.
turbine_efficiency: The isentropic efficiency of the turbocharger turbine, which converts exhaust gas energy into mechanical power to drive the compressor. Expressed as a percentage (0-100%), where higher values indicate better energy conversion. Typical values range from 60-80% depending on turbine design and operating point.<br>This is rarely published by manufacturers, so use conservative estimates unless you have specific data.
exhaust_backpressure: The pressure resistance of the entire turbo-back exhaust system measured at the turbine inlet. Lower values occur with straight pipe systems (typically 2-5 psi), while higher values occur with restrictive components like catalytic converters and mufflers (5-15+ psi). Affects turbine performance and engine scavenging efficiency.
air_fuel_ratio: "The target air-to-fuel ratio for combustion. The stoichiometric ratio (complete combustion with no excess air or fuel) varies by fuel type: Gasoline 14.7:1, Diesel 14.5:1, E85 9.8:1, E100 9.0:1, M1 6.5:1. Boosted engines typically run richer (lower ratios) than stoichiometric for safety, cooling, and power."
air_fuel_lambda: The air-to-fuel ratio expressed as lambda (λ), a normalized ratio relative to the stoichiometric point. λ = 1.0 represents perfect stoichiometric combustion, λ < 1.0 indicates a rich mixture (more fuel), and λ > 1.0 indicates a lean mixture (more air). Calculated by dividing the actual air-to-fuel ratio by the fuel type's stoichiometric ratio.
turbine_expansion_ratio: The ratio of exhaust pressure at the turbine inlet to the outlet pressure, which determines the energy available to drive the turbine. Affects turbine performance and wastegate duty cycle. Tune this parameter to ensure the wastegating percentage remains reasonable (typically 5-25%) across the operating range.
wastegating_amount: The percentage of exhaust gas that bypasses the turbine through the wastegate to maintain the target boost pressure. Expressed as a percentage (0-100%), where higher values indicate more exhaust is diverted. Typical values range from 5-25% across the operating range. Lower wastegating allows more exhaust energy to drive the turbine, while higher wastegating reduces turbine speed and boost pressure.
absolute_pressure: The total air pressure at the compressor outlet, this is the sum of ambient pressure and boost pressure.
pressure_ratio: The ratio of absolute pressure at the compressor outlet to the pressure at the compressor inlet. Calculated as compressor outlet pressure divided by intake air pressure.
comp_outlet_temperature: The temperature of the air exiting the turbocharger compressor after compression. Higher boost pressures and lower compressor efficiency result in higher outlet temperatures.
manifold_air_density: The density of air in the intake manifold after cooling by the intercooler. Calculated based on manifold absolute pressure and temperature. Higher air density increases the mass of air available for combustion, directly affecting power output.
comp_air_mass_flow: The actual mass flow rate of air exiting the turbocharger compressor. This value determines the amount of air available for combustion and directly affects power output and fuel requirements.
comp_air_flow: The volumetric flow rate of air exiting the turbocharger compressor at actual operating conditions.
corrected_air_mass_flow: The mass flow rate of air at the compressor outlet corrected to standard conditions (sea level, 25°C). Corrected values normalize for altitude and ambient temperature, allowing direct comparison with compressor map data.
corrected_air_flow: The volumetric flow rate of air at the compressor outlet corrected to standard conditions (sea level, 25°C). Corrected values normalize for altitude and ambient temperature, allowing direct comparison with compressor map data.
fuel_mass_flow: The mass flow rate of fuel required for combustion at the target air-to-fuel ratio. Calculated by dividing the actual air mass flow by the air-to-fuel ratio. Determines fuel pump capacity and injector sizing requirements.
fuel_volume_flow: The volumetric flow rate of fuel required for combustion at the target air-to-fuel ratio. Determines fuel pump flow capacity and injector sizing requirements.
injector_flow: The volumetric flow rate of fuel per individual injector required for combustion. Used to determine individual injector sizing requirements and ensure adequate fuel delivery at peak power.
turbo_shaft_power: The mechanical power required to drive the turbocharger compressor at the given boost pressure and air mass flow rate. Determines the energy the turbine must extract from exhaust gases to maintain boost.
exhaust_mass_flow: The total mass flow rate of exhaust gases exiting the engine. Determines turbine inlet conditions and exhaust system sizing requirements.
wastegate_mass_flow: The mass flow rate of exhaust gas that bypasses the turbine through the wastegate. Represents the portion of exhaust energy not used to drive the turbine.
exhaust_manifold_pressure: The absolute pressure of exhaust gases at the turbine inlet. Determines the pressure differential across the turbine and the energy available to drive the compressor. Higher values indicate greater turbine driving potential.
turbine_swallowing_param: The turbine swallowing parameter (phi), which characterizes the turbine's ability to flow exhaust gas at a given expansion ratio. Used to match turbine performance against turbine maps.
corrected_exhaust_flow: The mass flow rate of exhaust gas at the turbine outlet corrected to standard conditions (sea level, 25°C). Corrected values normalize for altitude and turbine inlet conditions, allowing direct comparison with turbine map data.
estimated_power: The estimated power produced at the crankshaft by the engine at the given operating conditions. Calculated using a simplified formula based on air mass flow rate (approximately 1.25 hp per gram of air per second). This provides a quick estimate of power output for comparison purposes, though actual power will vary based on engine efficiency, fuel quality, and tuning.
estimated_torque: The estimated torque produced at the crankshaft by the engine at the given operating conditions. Calculated from estimated power, this provides a quick estimate of torque output for comparison purposes, though actual torque will vary based on engine efficiency, fuel quality, and tuning.
min_injector_size: The minimum injector flow capacity required to safely support the engine's maximum fuel demand across the entire operating range. Calculated by finding the peak injector flow rate from all data points and applying a 20% safety margin. Determines the required fuel injector size in cubic centimeters per minute (cc/min).
min_fuel_pump_size: The minimum fuel pump flow capacity required to safely support the engine's maximum fuel demand across the entire operating range. Calculated by finding the peak fuel volume flow rate from all data points and applying a 20% safety margin (dividing by 0.8).
